<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <base href="/TapTrack/kassieren/" />
    <title>TapTrack</title>
    <link rel="stylesheet" href="/TapTrack/src/style.css" />
  </head>
  <body>
    <main class="relative flex h-dvh w-screen flex-col bg-neutral-400">
      <!-- overview -->
      <div id="overviewContainer" class="absolute h-full w-full bg-neutral-400 opacity-75 hidden">
        <div class="flex h-full w-full flex-col items-center justify-center gap-5">
          <div class="rounded-xl border-2 border-neutral-900 bg-neutral-200 p-5">
            <span id="totalPrice" class="font-semibold text-neutral-900">30,50€</span>
          </div>
          <!-- overview list -->
          <div id="overviewList" class="flex w-3/4 flex-col gap-5 rounded-xl border-2 border-neutral-900 bg-neutral-200 p-5">
            
          </div>

          <div class="flex w-3/4 gap-5">
            <button onclick="cancelSummary()" class="h-15 grow rounded-xl border-2 border-neutral-900 bg-red-800">
              <span class="font-semibold text-neutral-100">ZURÜCK</span>
            </button>
            <button onclick="doneSummary()" class="h-15 grow rounded-xl border-2 border-neutral-900 bg-green-800">
              <span class="font-semibold text-neutral-100">FERTIG</span>
            </button>
          </div>
        </div>
      </div>

      <!-- HEADER -->
      <div class="flex w-full grid-cols-3">
        <button onclick="clearSelectedProducts()" class="m-2.5 h-15 w-15 rounded-full border-2 border-neutral-900 bg-red-800">
          <span class="font-semibold text-neutral-100">X</span>
        </button>
        <select id="StandSelect" class="m-2.5 grow rounded-xl border-2 border-neutral-900 bg-neutral-100 px-5 font-semibold text-neutral-900">
          <option value="" hidden>Stand Wählen</option>
          <option value="1">Stand 1</option>
          <option value="2">Stand 2</option>
          <option value="3">Stand 3</option>
        </select>
        <button onclick="showSummary()" class="m-2.5 h-15 w-15 rounded-full border-2 border-neutral-900 bg-green-800">
          <span class="font-semibold text-neutral-100">OK</span>
        </button>
      </div>

      <!-- Seperation -->
      <div class="h-px w-full bg-neutral-900"></div>

      <!-- Menu -->
      <div class="w-full grow overflow-auto">
        <div id="productContainer" class="m-2.5 grid grid-cols-2 gap-2.5"></div>
      </div>

      <!-- Seperation -->
      <div class="h-px w-full bg-neutral-900"></div>

      <!-- Footer -->
      <div class="flex h-20 w-full items-center justify-center">
        <button onclick="window.location.replace('/TapTrack')" class="m-2.5 h-15 w-45 rounded-xl border-2 border-neutral-900 bg-red-800">
          <span class="font-semibold text-neutral-100">Exit</span>
        </button>
      </div>
    </main>

    <!-- Supabase Client -->
    <script src="/TapTrack/src/supabase.js"></script>

    <script src="script.js"></script>
  </body>
</html>
