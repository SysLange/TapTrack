<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <base href="https://syslange.github.io/TapTrack/">
    <title>TapTrack</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="grid h-dvh w-screen grid-cols-1 bg-neutral-400">
      <div class="bg-neutral-200"></div>
      <div class="flex items-center justify-center">
        <form class="flex flex-col items-center">
          <label for="name">Name:</label>
          <input type="text" name="name" class="bg-neutral-200" />

          <label for="password">Password:</label>
          <input type="password" name="password" class="bg-neutral-200" />
          <input type="submit" value="Submit" class="bg-green-400" />
        </form>
      </div>
      <div class="bg-neutral-200"></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
