<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <base href="https://syslange.github.io/TapTrack/" />
    <title>TapTrack</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="grid h-dvh w-screen grid-cols-1 bg-neutral-400">
      <div class="bg-neutral-200"></div>
      <div class="flex items-center justify-center">
        <div class="flex flex-col items-center gap-5">
          <!-- Drop Down Stand Auswahl -->
          <div class="relative w-75">
            <select name="cars" id="cars" class="h-15 w-full appearance-none rounded-lg bg-neutral-100 pr-12 pl-5 font-semibold">
              <option value="" selected disabled hidden>Stand Wählen</option>
              <option value="s1">Stand 1</option>
              <option value="s2">Stand 2</option>
              <option value="s3">Stand 3</option>
              <option value="s4">Stand 4</option>
            </select>

            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center rounded-r-lg bg-orange-400 px-4 text-neutral-100">
              <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>

          <!-- Passwort -->
          <input type="password" class="h-15 w-75 rounded-lg bg-neutral-100 px-5 font-semibold" placeholder="Passwort" />

          <!-- Login Buttons -->
          <div class="flex w-75 justify-between">
            <button class="h-15 w-35 rounded-lg bg-orange-400 text-white">Kasse</button>
            <button class="h-15 w-35 rounded-lg bg-orange-400 text-white">Zapfe</button>
          </div>
        </div>
      </div>
      <div class="bg-neutral-200"></div>
    </main>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>
  </body>
</html>
