<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <base href="https://syslange.github.io/TapTrack/" />
    <title>TapTrack</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="grid h-dvh w-screen grid-cols-1 bg-neutral-400">
      <!-- Logo -->
      <div class="flex flex-col items-center justify-center">
        <img class="h-25 w-25" src="https://syslange.github.io/TapTrack/icon.png" />
        <span class="text-3xl font-semibold">TapTrack</span>
      </div>

      <!-- Form -->
      <div class="flex items-center justify-center">
        <div class="flex flex-col items-center gap-5">
          <!-- Fehlermeldung -->
          <span id="fehlerSpan" class="font-semibold text-red-800"></span>

          <!-- Passwort Input -->
          <input id="passwortInput" class="h-15 w-75 rounded-xl border-2 border-neutral-900 bg-neutral-100 px-5 font-semibold text-neutral-900" type="password" placeholder="Passwort" />

          <!-- Kassieren Button -->
          <button id="kassierenButton" class="h-15 w-75 rounded-xl border-2 border-neutral-900 bg-green-800">
            <span class="font-semibold text-neutral-100">Kassieren</span>
          </button>

          <!-- Zapfen Button -->
          <button id="zapfenButton" class="h-15 w-75 rounded-xl border-2 border-neutral-900 bg-green-800">
            <span class="font-semibold text-neutral-100">Zapfen</span>
          </button>
        </div>
      </div>

      <!-- Footer -->
      <div class="flex flex-col items-center justify-center">
        <span class="font-semibold text-neutral-900">Made with ❤️ by</span>
        <span class="font-semibold text-neutral-900">Ben Lange</span>
      </div>
    </main>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
  </body>
</html>
